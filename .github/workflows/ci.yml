name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: mongodb://localhost:27018/screen_record_test?replicaSet=rs0&directConnection=true
      DESKTOP_INGEST_SECRET: ci-test-secret
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w screen-record-web

      - name: Unit tests
        run: npm run test:unit

      - name: Start MongoDB replica set
        run: |
          docker run -d -p 27018:27017 --name mongo mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --eval "db.adminCommand('ping')" --quiet && break
            sleep 1
          done
          docker exec mongo mongosh --eval "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
          for i in $(seq 1 30); do
            docker exec mongo mongosh --eval "rs.status().ok" --quiet | grep -q 1 && break
            sleep 1
          done

      - name: Integration tests
        run: npm run test:integration

      - name: Build web
        run: npm run build:web
